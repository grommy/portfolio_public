function showTip(ev, head, rows, more) {
  tip.replaceChildren();
  h("div", "head", head, tip);
  for (const r of rows) {
    const row = h("div", "row", null, tip);
    const key = h("span", "key", null, row);
    if (r.color) key.style.borderTopColor = r.color;
    if (r.dash) key.style.borderTopStyle = "dashed";
    h("span", null, r.name, row);
    h("b", null, r.value, row);
  }
  for (const m of more || []) h("div", "more", m, tip);
  tip.style.display = "block";
  const w = tip.offsetWidth, x = ev.clientX + 16 + w > innerWidth ? ev.clientX - w - 16 : ev.clientX + 16;
  tip.style.left = x + "px"; tip.style.top = Math.max(8, ev.clientY - 20) + "px";
}
const hideTip = () => { tip.style.display = "none"; };

function niceStep(span, max) { for (const s of [1, 2, 2.5, 5, 10, 20, 25, 50, 100]) if (span / s <= max) return s; return 200; }

function frame(host, o) {
  const W = 1000, H = o.h || 360, m = { t: 26, r: 64, b: 28, l: 44 };
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart", role: "img", "aria-label": o.label }, host);
  const step = niceStep(o.y1 - o.y0, 7), y0 = Math.floor(o.y0 / step) * step, y1 = Math.ceil(o.y1 / step) * step;
  const X = v => m.l + (v - o.x0) / (o.x1 - o.x0) * (W - m.l - m.r);
  const Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  for (let v = y0; v <= y1 + 1e-9; v += step) {
    el("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }, svg);
    el("text", { x: m.l - 8, y: Y(v) + 4, "text-anchor": "end" }, svg).textContent = v + (o.unit ?? "%");
  }
  const clip = "clip" + document.querySelectorAll("clipPath").length;
  el("rect", { x: m.l, y: m.t, width: W - m.l - m.r + 40, height: H - m.t - m.b }, el("clipPath", { id: clip }, svg));
  return { svg, X, Y, W, H, m, y0, y1, clip };
}

function yearTicks(f, x0, x1) {
  for (let y = new Date(x0).getUTCFullYear() + 1; Date.UTC(y, 0, 1) <= x1; y++) {
    const x = f.X(Date.UTC(y, 0, 1));
    el("line", { x1: x, x2: x, y1: f.H - f.m.b, y2: f.H - f.m.b + 4, stroke: "var(--axis)" }, f.svg);
    el("text", { x, y: f.H - 8, "text-anchor": "middle" }, f.svg).textContent = y;
  }
}

function divider(f, x, left, right) {
  el("line", { x1: x, x2: x, y1: f.m.t - 12, y2: f.H - f.m.b, stroke: "var(--axis)", "stroke-width": 1 }, f.svg);
  el("text", { x: x - 8, y: f.m.t - 4, "text-anchor": "end" }, f.svg).textContent = left;
  el("text", { x: x + 8, y: f.m.t - 4 }, f.svg).textContent = right;
}

const path = (f, pts) => pts.map((p, i) => (i ? "L" : "M") + f.X(T(p.d)).toFixed(1) + " " + f.Y(p.g).toFixed(1)).join("");
function area(f, pts, lo, hi, fill) {
  const up = pts.map(p => f.X(T(p.d)).toFixed(1) + " " + f.Y(hi(p)).toFixed(1));
  const dn = pts.slice().reverse().map(p => f.X(T(p.d)).toFixed(1) + " " + f.Y(lo(p)).toFixed(1));
  el("path", { d: "M" + up.concat(dn).join("L") + "Z", fill }, f.svg);
}
function line(f, pts, color, dash) {
  el("path", { d: path(f, pts), "clip-path": `url(#${f.clip})`, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", ...(dash ? { "stroke-dasharray": "6 5" } : {}) }, f.svg);
}
function dot(f, p, color, hollow) {
  el("circle", { cx: f.X(T(p.d)), cy: f.Y(p.g), r: hollow ? 4 : 4.5, fill: hollow ? "var(--surface)" : color, stroke: hollow ? color : "var(--surface)", "stroke-width": 2 }, f.svg);
}
function breakMark(f, p, text, side) {
  const x = f.X(T(p.d)), y = f.Y(p.g), up = p.flag === "up", s = up ? -1 : 1;
  el("circle", { cx: x, cy: y, r: 6, fill: "var(--surface)", stroke: "var(--ink)", "stroke-width": 1.5 }, f.svg);
  const base = y + s * 12, apex = y + s * 20;
  el("path", { d: `M${x - 5} ${base}L${x + 5} ${base}L${x} ${apex}Z`, fill: "var(--ink)" }, f.svg);
  el("text", { x: side ? x + 10 : x, y: y + s * 31 + 4, "text-anchor": side ? "start" : "middle", class: "note" }, f.svg).textContent = text;
}

function hover(f, pts, describe) {
  const cross = el("line", { y1: f.m.t, y2: f.H - f.m.b, stroke: "var(--ink2)", "stroke-width": 1, visibility: "hidden" }, f.svg);
  const hit = el("rect", { x: f.m.l, y: f.m.t, width: f.W - f.m.l - f.m.r + 30, height: f.H - f.m.t - f.m.b, fill: "transparent" }, f.svg);
  const xs = [...new Set(pts.map(p => p.d))].sort();
  hit.addEventListener("pointermove", ev => {
    const r = f.svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * f.W;
    const d = xs.reduce((a, b) => Math.abs(f.X(T(b)) - px) < Math.abs(f.X(T(a)) - px) ? b : a);
    cross.setAttribute("x1", f.X(T(d))); cross.setAttribute("x2", f.X(T(d))); cross.setAttribute("visibility", "visible");
    const here = pts.filter(p => p.d === d), [head, rows, more] = describe(here);
    showTip(ev, head, rows, more);
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); hideTip(); });
}

function legend(id, items) {
  for (const it of items) {
    const s = h("span", null, null, $(id));
    const k = el("svg", { width: 22, height: 12, viewBox: "0 0 22 12" }, s);
    if (it.kind === "line") el("line", { x1: 1, x2: 21, y1: 6, y2: 6, stroke: it.color, "stroke-width": it.w || 2, "stroke-linecap": "round", ...(it.dash ? { "stroke-dasharray": "5 4" } : {}) }, k);
    if (it.kind === "rect") el("rect", { x: 3, y: 1, width: 16, height: 10, rx: 2, fill: it.color, ...(it.opacity ? { opacity: it.opacity } : {}) }, k);
    if (it.kind === "dot") el("circle", { cx: 11, cy: 6, r: 4, fill: it.hollow ? "var(--surface)" : it.color, stroke: it.hollow ? it.color : "none", "stroke-width": 2 }, k);
    if (it.kind === "break") { el("circle", { cx: 6, cy: 6, r: 4.5, fill: "var(--surface)", stroke: "var(--ink)", "stroke-width": 1.5 }, k); el("path", { d: "M13 9L21 9L17 3Z", fill: "var(--ink)" }, k); }
    s.appendChild(document.createTextNode(it.text));
  }
}

function table(id, head, rows) {
  const t = h("table", null, null, $(id)), tr = h("tr", null, null, h("thead", null, null, t));
  head.forEach(c => h("th", null, c, tr));
  const tb = h("tbody", null, null, t);
  for (const r of rows) { const row = h("tr", null, null, tb); r.forEach(c => h("td", null, c, row)); }
}

  const src = { rev: rep + cons, eps: rep + cons + gaap, drv: rep + gaap, rvn: D.asof.revisions ? W.srcRvn(D.asof.revisions) : "" };
  for (const card of document.querySelectorAll("section.card")) {
    const k = card.dataset.card, who = h("div", "who"), [title, sub] = W.cards[k], date = k === "rvn" ? D.asof.revisions : D.asof.consensus;
    brand(who, date && W.asof(date));
    card.prepend(who);
    card.querySelector("h2").textContent = title;
    card.querySelector(".sub").textContent = typeof sub === "function" ? sub(D.eps.basis) : sub;
    const det = card.querySelector("details");
    if (det) det.querySelector("summary").textContent = W.table;
    card.insertBefore(h("p", "src", src[k] + W.tail), det);
  }
}

function revenue() {
  const lastX = T(D.last_reported), R = D.revenue, rep = R.reported.filter(shown), cons = R.consensus, bey = R.beyond, all = rep.concat(cons, bey);
  const vals = all.flatMap(p => [p.g, p.lo ?? p.g, p.hi ?? p.g, ...(p.band || [])]);
  const x0 = T(rep[0].d) - 40 * 864e5, x1 = T(all[all.length - 1].d) + 60 * 864e5;
  const f = frame($("c-rev"), { x0, x1, y0: Math.min(...vals) - 1, y1: Math.max(...vals) + 2, label: W.aria.rev });
  yearTicks(f, x0, x1);
  area(f, all.filter(p => p.band), p => p.band[0], p => p.band[1], "var(--band)");
  const join = rep[rep.length - 1];
  area(f, [{ d: join.d, lo: join.g, hi: join.g }].concat(cons), p => p.lo, p => p.hi, "color-mix(in srgb, var(--s1) 13%, transparent)");
  divider(f, f.X(lastX), W.reported, W.consensus);
  const yL = f.Y(R.latest.g);
  el("line", { x1: f.X(lastX), x2: f.W - f.m.r, y1: yL, y2: yL, stroke: "var(--ink2)", "stroke-width": 1 }, f.svg);
  el("text", { x: f.W - f.m.r, y: yL - 6, "text-anchor": "end", class: "note" }, f.svg).textContent = W.latest;
  line(f, rep, "var(--s1)");
  line(f, [join].concat(cons, bey), "var(--s1)", true);
  bey.forEach(p => dot(f, p, "var(--s1)", p.thin));
  rep.filter(p => p.onset).forEach(p => breakMark(f, p, p.label));
  const exit = cons.concat(bey).find(p => p.onset);
  // A break called in the first consensus periods sits beside the last reported point: its label goes to the right and the value to the left.
  const tight = exit && f.X(T(exit.d)) - f.X(T(join.d)) < 90;
  if (exit) breakMark(f, exit, W.leaves(exit.label), tight);
  dot(f, join, "var(--s1)");
  el("text", tight ? { x: f.X(T(join.d)) - 10, y: f.Y(join.g) + (exit.flag === "up" ? 18 : -10), "text-anchor": "end", class: "strong" } : { x: f.X(T(join.d)) + 9, y: f.Y(join.g) - 8, class: "strong" }, f.svg).textContent = f1(join.g);
  const end = all[all.length - 1];
  el("text", { x: f.X(T(end.d)) + 10, y: f.Y(end.g) + 4, class: "strong" }, f.svg).textContent = f1(end.g);
  hover(f, all, here => {
    const p = here[0], more = [W.tipRevenue(money(p.level))];
    if (p.band) more.push(W.tipExpected(f1(p.band[0]), f1(p.band[1])) + (p.flag ? (p.run ? W.tipSince(W.flag[p.flag], p.run) : W.tipOnce) : ""));
    if (p.gap != null) more.push(W.tipGap(sg(p.gap), R.latest.label));
    if (p.thin) more.push(W.thin);
    if (p.lo != null) more.push(W.tipRange(f1(p.lo), f1(p.hi)));
    if (p.n) more.push(W.analysts(p.n));
    return [`${p.label} · ${p.d}`, [{ name: W.kinds[p.kind], value: f1(p.g), color: "var(--s1)", dash: p.kind !== "reported" }], more];
  });
  const L = W.lgRev;
  legend("lg-rev", [
    { kind: "line", color: "var(--s1)", text: L[0] }, { kind: "line", color: "var(--s1)", dash: true, text: L[1] },
    { kind: "rect", color: "var(--s1)", opacity: 0.2, text: L[2] }, { kind: "rect", color: "var(--band)", text: L[3] }, { kind: "line", color: "var(--ink2)", w: 1, text: L[4] },
    { kind: "break", text: L[5] }, { kind: "dot", color: "var(--s1)", hollow: true, text: L[6] },
  ]);
  table("t-rev", W.thRev, all.map(p => [
    p.label, p.d, W.kinds[p.kind], money(p.level), f1(p.g), p.gap != null ? sg(p.gap) : "", p.band ? W.span(f1(p.band[0]), f1(p.band[1])) : "", p.lo != null ? W.span(f1(p.lo), f1(p.hi)) : "",
    p.thin ? W.notJudged : p.flag ? (p.run ? W.flag[p.flag] : W.once) : ""]));
}

function eps() {
  const lastX = T(D.last_reported), E = D.eps, rep = E.reported.filter(shown), all = rep.concat(E.gaap_fc, E.adj_fc);
  const x0 = T(rep[0].d) - 40 * 864e5, x1 = Math.max(...all.map(p => T(p.d))) + 60 * 864e5;
  const peak = all.reduce((a, b) => b.g > a.g ? b : a), CAP = 90;
  const f = frame($("c-eps"), { x0, x1, y0: Math.min(...all.map(p => p.g)) - 3, y1: Math.min(peak.g + 3, CAP), label: W.aria.eps });
  yearTicks(f, x0, x1);
  divider(f, f.X(lastX), W.reported, W.consensus);
  if (peak.g > f.y1) el("text", { x: f.W - f.m.r, y: f.m.t + 15, "text-anchor": "end", class: "note" }, f.svg).textContent = W.offScale(f1(peak.g), peak.label);
  const join = rep[rep.length - 1];
  line(f, rep, "var(--s1)");
  line(f, [join].concat(E.gaap_fc), "var(--s1)", true);
  line(f, E.adj_fc, "var(--s2)", true);
  E.gaap_fc.forEach(p => dot(f, p, "var(--s1)"));
  E.adj_fc.forEach(p => dot(f, p, "var(--s2)", p.thin));
  dot(f, join, "var(--s1)");
  if (join.g <= f.y1) el("text", { x: f.X(T(join.d)) - 9, y: f.Y(join.g) + 16, class: "strong", "text-anchor": "end" }, f.svg).textContent = f1(join.g);
  const g = E.gaap_fc[E.gaap_fc.length - 1], a = E.adj_fc[E.adj_fc.length - 1];
  if (g) el("text", { x: f.X(T(g.d)) + 4, y: f.Y(g.g) + 20, class: "note", "text-anchor": "middle" }, f.svg).textContent = `GAAP ${f1(g.g)}`;
  if (a) el("text", { x: f.X(T(a.d)) + 10, y: f.Y(a.g) + 4, class: "note" }, f.svg).textContent = W.analysts(a.n);
  hover(f, all, here => [
    `${here[0].label} · ${here[0].d}`,
    here.map(p => ({ name: p.kind === "reported" ? W.ttm : W.kinds[p.kind], value: f1(p.g), color: p.series === "snap" ? "var(--s2)" : "var(--s1)", dash: p.kind !== "reported" })),
    here.map(p => W.epsLine(p.series === "snap" ? E.basis : "gaap", n2(p.level)) + (p.n ? `, ${W.analysts(p.n)}` : "")),
  ]);
  const L = W.lgEps(E.basis);
  legend("lg-eps", [
    { kind: "line", color: "var(--s1)", text: L[0] }, { kind: "line", color: "var(--s1)", dash: true, text: L[1] },
    { kind: "line", color: "var(--s2)", dash: true, text: L[2] }, { kind: "dot", color: "var(--s2)", hollow: true, text: L[3] },
  ]);
  const n = E.naive.filter(x => x.yoy > 25);
  $("naive").hidden = !n.length;
  if (n.length) $("naive").textContent = W.naive(n.map(x => "+" + x.yoy.toFixed(0) + "%").join(", "), n[0].label, n[n.length - 1].label);
  table("t-eps", W.thEps, all.map(p => [p.label, p.d, p.kind === "reported" ? W.ttm : W.kinds[p.kind], n2(p.level), f1(p.g), p.n ?? ""]));
}

function drivers() {
  const rows = D.drivers, parts = [["revenue", "var(--s1)"], ["margin", "var(--s2)"], ["shares", "var(--s3)"]];
  let lo = 0, hi = 0;
  for (const r of rows) { let p = 0, n = 0; for (const [k] of parts) r[k] >= 0 ? p += r[k] : n += r[k]; hi = Math.max(hi, p); lo = Math.min(lo, n); }
  const f = frame($("c-drv"), { h: 320, x0: -0.6, x1: rows.length - 0.4, y0: lo - 2, y1: hi + 2, unit: "", label: W.aria.drv });
  const bw = 24, firstFc = rows.findIndex(r => r.kind !== "reported");
  if (firstFc > 0) divider(f, f.X(firstFc - 0.5), W.reported, W.consensus);
  rows.forEach((r, i) => {
    const cx = f.X(i), fc = r.kind !== "reported";
    el("text", { x: cx, y: f.H - 8, "text-anchor": "middle" }, f.svg).textContent = r.fy;
    let up = 0, dn = 0;
    const segs = parts.map(([k, color]) => { const v = r[k], a = v >= 0 ? up : dn; if (v >= 0) up += v; else dn += v; return { color, a, b: a + v }; });
    for (const s of segs) {
      const yA = f.Y(s.a), yB = f.Y(s.b), top = Math.min(yA, yB), ht = Math.abs(yA - yB) - 2;
      if (ht <= 0.5) continue;
      const outer = s.b === up || s.b === dn, y = s.b >= s.a ? top : top + 2, r4 = outer ? Math.min(4, ht / 2) : 0, x = cx - bw / 2;
      const d = s.b >= s.a
        ? `M${x} ${y + ht}V${y + r4}Q${x} ${y} ${x + r4} ${y}H${x + bw - r4}Q${x + bw} ${y} ${x + bw} ${y + r4}V${y + ht}Z`
        : `M${x} ${y}V${y + ht - r4}Q${x} ${y + ht} ${x + r4} ${y + ht}H${x + bw - r4}Q${x + bw} ${y + ht} ${x + bw} ${y + ht - r4}V${y}Z`;
      el("path", { d, fill: s.color, opacity: fc ? 0.6 : 1 }, f.svg);
    }
    el("circle", { cx, cy: f.Y(r.total), r: 4.5, fill: "var(--ink)", stroke: "var(--surface)", "stroke-width": 2 }, f.svg);
    const hit = el("rect", { x: cx - 22, y: f.m.t, width: 44, height: f.H - f.m.t - f.m.b, fill: "transparent" }, f.svg);
    hit.addEventListener("pointermove", ev => showTip(ev, `${r.fy} · ${W.kinds[r.kind]}`,
      parts.map(([k, color]) => ({ name: W.parts[k], value: sg(r[k]), color })).concat([{ name: W.sum, value: sg(r.total), color: "var(--ink)" }]),
      [W.epsGrowth(sg(r.eps_growth))]));
    hit.addEventListener("pointerleave", hideTip);
  });
  legend("lg-drv", parts.map(([k, color]) => ({ kind: "rect", color, text: W.parts[k] })).concat([{ kind: "dot", color: "var(--ink)", text: W.lgSum }]));
  table("t-drv", W.thDrv, rows.map(r => [r.fy, W.kinds[r.kind], sg(r.revenue), sg(r.margin), sg(r.shares), sg(r.total), sg(r.eps_growth) + "%"]));
}

function revisions() {
  if (!D.revisions.length) { $("t-rvn").textContent = W.noRvn; return; }
  const t = h("table", null, null, $("t-rvn")), tr = h("tr", null, null, h("thead", null, null, t));
  W.thRvn.forEach(c => h("th", null, c, tr));
  const tb = h("tbody", null, null, t);
  for (const r of D.revisions) {
    const row = h("tr", null, null, tb); h("td", null, r.label, row); h("td", null, n2(r.now), row);
    if (r.refused) { const c = h("td", "refused", W.refused[r.refused], row); c.colSpan = 4; }
    else ["7", "30", "60", "90"].forEach(d => h("td", null, sg(r.was[d]) + "%", row));
  }
}

function footnotes() {
  const ul = h("ul", null, null, $("foot"));
  W.foot(D.rule, D.revenue.latest, D.sources, D.eps.basis, D.asof).filter(Boolean).concat(D.text[LANG].notes).forEach(n => h("li", null, n, ul));
}

// ---- language: the page is drawn again in the language chosen; English is the default.
function render(lang) {
  LANG = S[lang] ? lang : "en"; W = S[LANG];
  document.documentElement.lang = LANG;
  hideTip();
  for (const id of ["who", "tiles", "lg-rev", "c-rev", "t-rev", "lg-eps", "c-eps", "t-eps", "lg-drv", "c-drv", "t-drv", "t-rvn", "foot"]) $(id).replaceChildren();
  document.querySelectorAll("section.card > .who, section.card > .src").forEach(e => e.remove());
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG));
  header(); revenue(); eps(); drivers(); revisions(); footnotes();
}
function stored() { try { return localStorage.getItem("growth-regime-lang"); } catch { return null; } }
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  render(b.dataset.lang);
  try { localStorage.setItem("growth-regime-lang", LANG); } catch {}
  try { history.replaceState(null, "", "#" + LANG); } catch {}
}));
render(location.hash.slice(1) || stored() || "en");
</script>
</body>
</html>
